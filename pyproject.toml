[project]
name = "SE_For_Media_Demo_Code"
authors = [
  { name="Jon Macey", email="jmacey@bournemouth.ac.uk" },
]
description = "Lecture code for SE for Media course"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {file = "LICENSE"}
version = "0.0.1"
dependencies = [
    "anywidget>=0.11.0",
    "datasets>=5.1.0",
    "deno>=2.9.7",
    "ipycanvas>=0.14.1",
    "ipyturtle3>=0.1.4",
    "kagglehub>=1.0.2",
    "marimo>=0.14.17",
    "marimo-lens>=0.2.3",
    "marimo-studio>=0.2.3",
    "matplotlib>=3.10.1",
    "numpy>=2.2.3",
    "onnx>=1.19.0",
    "onnxruntime>=1.22.1",
    "onnxscript>=0.4.0",
    "pandas>=2.2.3",
    "plotly>=7.1.0",
    "polars>=1.24.0",
    "pydantic-ai-slim>=2.52.0",
    "pyqt5>=5.15.11",
    "qtpy>=2.4.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.1",
    "soundfile>=0.13.1",
    "torch>=2.11.0",
    "torchaudio>=2.6.0",
    "torchcodec>=0.16.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
]
# always enforce latest marimo
[tool.uv]
upgrade-package = ["marimo"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


[dependency-groups]
dev = [
    "ipykernel>=6.16.2",
    "playwright>=1.63.0",
]

[tool.marimo.display]
default_width = "full"

[tool.ruff]
exclude = [
    "*.ipynb",   # ignore all notebooks
]
